name: sample
display_name: Sample
display_name_plural: Samples

id_columns:
  - id_column: sample.ID
    entity_name: sample
    provider_label:
      - sample ID

variables:
  - variable: SRA.ID.s.
    provider_label:
      - SRA ID(s)
    display_name: SRA ID(s)
    data_type: string
    data_shape: categorical
    is_multi_valued: yes
    multi_value_delimiter: ','
  - variable: label
    provider_label:
      - label
    display_name: label
    data_type: string
    data_shape: categorical
  - variable: genotype
    provider_label:
      - genotype
    display_name: Genotype
    definition: 'Fungal strain: wild-type Z7 or AaSom1 deletion mutant'
    data_type: string
    data_shape: categorical
  - variable: condition
    provider_label:
      - condition
    display_name: Growth condition
    definition: Control (CK) or inoculated on citrus leaf
    data_type: string
    data_shape: categorical
  - variable: timePostInoculation
    provider_label:
      - timePostInoculation
    display_name: Time post inoculation
    definition: Hours after start of treatment at sampling
    data_type: integer
    data_shape: continuous
    unit: hour

categories: []
collections: []
