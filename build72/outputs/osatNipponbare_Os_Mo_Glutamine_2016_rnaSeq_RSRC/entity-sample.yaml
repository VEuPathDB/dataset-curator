name: sample
display_name: Sample
display_name_plural: Samples

id_columns:
  - id_column: sample.ID
    entity_name: sample
    provider_label:
      - sample ID

variables:
  - variable: SRA.ID.s.
    provider_label:
      - SRA ID(s)
    display_name: SRA ID(s)
    data_type: string
    data_shape: categorical
    is_multi_valued: yes
    multi_value_delimiter: ','
  - variable: label
    provider_label:
      - label
    display_name: label
    data_type: string
    data_shape: categorical
  - variable: nitrogenTreatment
    provider_label:
      - nitrogenTreatment
    display_name: Nitrogen treatment
    definition: Glutamine nitrogen supply level (0N = none, 1N = standard)
    data_type: string
    data_shape: categorical
  - variable: inoculation
    provider_label:
      - inoculation
    display_name: Inoculation
    definition: Magnaporthe oryzae Guy11 or mock inoculation status of rice shoots
    data_type: string
    data_shape: categorical
  - variable: timePostInoculation
    provider_label:
      - timePostInoculation
    display_name: Time post inoculation
    definition: Days after inoculation at sampling
    data_type: integer
    data_shape: continuous
    unit: day

categories: []
collections: []
