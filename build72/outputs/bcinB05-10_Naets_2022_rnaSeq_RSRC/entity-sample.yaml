name: sample
display_name: Sample
display_name_plural: Samples

id_columns:
  - id_column: sample.ID
    entity_name: sample
    provider_label:
      - sample ID

variables:
  - variable: SRA.ID.s.
    provider_label:
      - SRA ID(s)
    display_name: SRA ID(s)
    data_type: string
    data_shape: categorical
    is_multi_valued: yes
    multi_value_delimiter: ','
  - variable: label
    provider_label:
      - label
    display_name: label
    data_type: string
    data_shape: categorical
  - variable: timePostInoculation
    provider_label:
      - timePostInoculation
    display_name: Time post inoculation
    definition: Time elapsed since inoculation of the fruit
    data_type: integer
    data_shape: continuous
    unit: hour
  - variable: treatment
    provider_label:
      - treatment
    display_name: Treatment
    definition: Inoculation treatment applied to the fruit
    data_type: string
    data_shape: categorical
  - variable: hostCultivar
    provider_label:
      - hostCultivar
    display_name: Host cultivar
    definition: Apple cultivar of the infected fruit
    data_type: string
    data_shape: categorical
  - variable: hostTissue
    provider_label:
      - hostTissue
    display_name: Host tissue
    definition: Apple fruit tissue sampled
    data_type: string
    data_shape: categorical

categories: []
collections: []
