name: sample
display_name: Sample
display_name_plural: Samples

id_columns:
  - id_column: sample.ID
    entity_name: sample
    provider_label:
      - sample ID

variables:
  - variable: SRA.ID.s.
    provider_label:
      - SRA ID(s)
    display_name: SRA ID(s)
    data_type: string
    data_shape: categorical
    is_multi_valued: yes
    multi_value_delimiter: ','
  - variable: label
    provider_label:
      - label
    display_name: label
    data_type: string
    data_shape: categorical
  - variable: host
    provider_label:
      - host
    display_name: Growth substrate / host
    definition: Axenic culture medium or infected plant host species the fungus was sampled from
    data_type: string
    data_shape: categorical
  - variable: sampling_zone
    provider_label:
      - sampling_zone
    display_name: Sampling zone
    definition: Region sampled: leading-edge periphery of colony/lesion vs necrotic center
    data_type: string
    data_shape: categorical

categories: []
collections: []
