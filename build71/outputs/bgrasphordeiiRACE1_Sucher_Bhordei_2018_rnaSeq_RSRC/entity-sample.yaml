name: sample
display_name: Sample
display_name_plural: Samples

id_columns:
  - id_column: sample.ID
    entity_name: sample
    provider_label:
      - sample ID

variables:
  - variable: SRA.ID.s.
    provider_label:
      - SRA ID(s)
    display_name: SRA ID(s)
    data_type: string
    data_shape: categorical
    is_multi_valued: yes
    multi_value_delimiter: ','
  - variable: label
    provider_label:
      - label
    display_name: label
    data_type: string
    data_shape: categorical
  - variable: host_genotype
    provider_label:
      - host_genotype
    display_name: Host barley genotype
    definition: Barley line the pathogen was grown on: Lr34-resistant or susceptible
    data_type: string
    data_shape: categorical
  - variable: timepoint
    provider_label:
      - timepoint
    display_name: Time post infection
    definition: Time after inoculation when sample was collected (48 hpi or 5 dpi), expressed in hours
    data_type: integer
    data_shape: continuous
    unit: hour

categories: []
collections: []
