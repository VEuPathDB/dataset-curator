name: sample
display_name: Sample
display_name_plural: Samples

id_columns:
  - id_column: sample.ID
    entity_name: sample
    provider_label:
      - sample ID

variables:
  - variable: SRA.ID.s.
    provider_label:
      - SRA ID(s)
    display_name: SRA ID(s)
    data_type: string
    data_shape: categorical
    is_multi_valued: yes
    multi_value_delimiter: ','
  - variable: label
    provider_label:
      - label
    display_name: label
    data_type: string
    data_shape: categorical
  - variable: stage
    provider_label:
      - stage
    display_name: Germination stage
    definition: Sequential stage of conidial spore germination (STAGE1 dormant conidia through STAGE4 germinated conidia)
    data_type: string
    data_shape: categorical
  - variable: genotype
    provider_label:
      - genotype
    display_name: Genotype
    definition: 'Strain background: wild type, or deltaFoabaA null mutant complemented with native or A. fumigatus abaA ortholog'
    data_type: string
    data_shape: categorical

categories: []
collections: []
