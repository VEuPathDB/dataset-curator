name: sample
display_name: Sample
display_name_plural: Samples

id_columns:
  - id_column: sample.ID
    entity_name: sample
    provider_label:
      - sample ID

variables:
  - variable: SRA.ID.s.
    provider_label:
      - SRA ID(s)
    display_name: SRA ID(s)
    data_type: string
    data_shape: categorical
    is_multi_valued: yes
    multi_value_delimiter: ','
  - variable: label
    provider_label:
      - label
    display_name: label
    data_type: string
    data_shape: categorical
  - variable: rice_cultivar
    provider_label:
      - rice_cultivar
    display_name: Rice cultivar
    definition: Rice (Oryza sativa) cultivar used for infection
    data_type: string
    data_shape: categorical
  - variable: inoculation_method
    provider_label:
      - inoculation_method
    display_name: Inoculation method
    definition: Method used to inoculate leaves with M. oryzae spores (drop or spray)
    data_type: string
    data_shape: categorical
  - variable: timepoint
    provider_label:
      - timepoint
    display_name: Time post-inoculation
    definition: Hours after inoculation at which the sample was collected
    data_type: integer
    data_shape: continuous
    unit: hour

categories: []
collections: []
